<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF7F2">
<title>Wyprawka · lista</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
.head{display:flex;flex-direction:column;gap:8px}
.head p{margin:0}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;font-variant-numeric:tabular-nums}
.prog .bar{flex:1;height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.prog .bar span{display:block;height:100%;background:linear-gradient(90deg,#FF7A59,#FF4F82);border-radius:9px;transition:width .25s}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs a{flex:0 0 auto;text-decoration:none;border:1px solid var(--line);background:var(--surface)}
section.card{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h .cnt{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.now{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
.tip{font-size:14px;color:var(--ink-2);margin:0}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-top:1px dashed var(--line)}
.it:first-child{border-top:none}
.it input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
.it .rule{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;background:var(--t-sun);font-size:13px;font-weight:800;color:var(--t-sun-ink)}
.it .top-line{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.it .nm{font-weight:700}
.it.done .nm{text-decoration:line-through;color:var(--ink-2)}
.qty{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lvl{font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:999px}
.lvl.must{background:var(--t-coral);color:var(--t-coral-ink)}
.lvl.nice{background:var(--surface-2);color:var(--ink-2)}
.lvl.situational{background:var(--t-sky);color:var(--t-sky-ink)}
.why{font-size:14px;color:var(--ink-2);margin:4px 0 0}
.norm{font-size:12px;font-weight:700;color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.crit{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.avoid{background:color-mix(in srgb,var(--bad) 7%,var(--surface));border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
.avoid h2{color:var(--bad)}
.avoid .it{grid-template-columns:1fr}
.shops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.shop{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:14px;background:var(--surface-2);text-decoration:none;min-width:0;transition:transform .12s}
.shop:active{transform:scale(.97)}
.shop .th{height:56px;border-radius:10px;display:grid;place-items:center;overflow:hidden;background:var(--c);color:var(--i);font-weight:800;font-size:18px}
.shop .th img{width:100%;height:100%;object-fit:contain;background:#fff}
.shop b{font-size:12px;line-height:1.2;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop small{font-size:11px;color:var(--ink-2);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.aff{font-size:12px;color:var(--ink-2);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="brand" href="./"><i></i>Wyprawka</a></div>
  <nav class="tabs chips" id="tabs" data-i18n-attr="aria-label:l.lists">
    <a class="chip" href="#wyprawka" data-id="wyprawka" data-i18n="l.tab.bag">Wyprawka</a>
    <a class="chip" href="#sen" data-id="sen" data-i18n="l.tab.sleep">Pokój i sen</a>
    <a class="chip" href="#zabawki" data-id="zabawki" data-i18n="l.tab.toys">Zabawki</a>
  </nav>
  <div class="head">
    <h1 id="title">…</h1>
    <p class="muted" id="intro"></p>
    <div class="prog"><div class="bar"><span id="pbar" style="width:0"></span></div><span id="ptxt">0 / 0</span></div>
    <div class="chips" id="filters"></div>
    <p class="aff" id="aff" hidden></p>
  </div>
  <div id="list" class="wrap" style="max-width:none"></div>
  <footer data-i18n="disclaimer">Treści mają charakter informacyjny i nie zastępują porady pediatry ani położnej.</footer>
</div>
<script src="assets/i18n.js"></script>
<script>
I18N.add({
  pl:{"l.lists":"Listy","l.tab.bag":"Wyprawka","l.tab.sleep":"Pokój i sen","l.tab.toys":"Zabawki","l.must":"Niezbędne","l.nice":"Przydatne","l.situational":"Wg sytuacji",
    "l.f.all":"Wszystko","l.f.todo":"Do kupienia","l.now":"Teraz","l.norm":"Norma","l.err":"Nie udało się wczytać listy","l.err.d":"Otwórz aplikację z adresu serwera (nie z pliku) albo odśwież stronę.","l.shop":"Zobacz oferty","l.shops":"Gdzie kupić","l.aff":"Linki do sklepów mogą być linkami partnerskimi: przy zakupie dostajemy prowizję, cena się nie zmienia."},
  en:{"l.lists":"Lists","l.tab.bag":"Essentials","l.tab.sleep":"Room and sleep","l.tab.toys":"Toys","l.must":"Essential","l.nice":"Useful","l.situational":"Depends",
    "l.f.all":"All","l.f.todo":"To buy","l.now":"Now","l.norm":"Standard","l.err":"Couldn't load the list","l.err.d":"Open the app from a server address (not a local file) or refresh the page.","l.shop":"See offers","l.shops":"Where to buy","l.aff":"Shop links may be affiliate links: we earn a commission on purchases at no extra cost to you."},
  uk:{"l.lists":"Списки","l.tab.bag":"Посаг","l.tab.sleep":"Кімната і сон","l.tab.toys":"Іграшки","l.must":"Необхідне","l.nice":"Корисне","l.situational":"За ситуацією",
    "l.f.all":"Усе","l.f.todo":"Купити","l.now":"Зараз","l.norm":"Стандарт","l.err":"Не вдалося завантажити список","l.err.d":"Відкрийте застосунок з адреси сервера (не з файлу) або оновіть сторінку.","l.shop":"Переглянути","l.shops":"Де купити","l.aff":"Посилання на магазини можуть бути партнерськими: ми отримуємо комісію з покупки, ціна для вас не змінюється."}
});
</script>
<script src="assets/shops.js"></script>
<script src="assets/store.js"></script>
<script src="assets/nav.js" data-base="./"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t=I18N.t, LV={must:t("l.must"),nice:t("l.nice"),situational:t("l.situational")};
let D=null, id=null, filter="all", SH=null;
const key=(si,ii)=>`${si}.${ii}`;

async function load(){
  id=(location.hash||"#wyprawka").slice(1);
  if(!["wyprawka","sen","zabawki"].includes(id))id="wyprawka";
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-pressed",a.dataset.id===id));
  try{D=await (await fetch(I18N.dataPath("",id))).json()}
  catch(e){$("#title").textContent=t("l.err");$("#intro").textContent=t("l.err.d");return}
  if(!SH)try{SH=await (await fetch("data/shop.json")).json()}catch(e){SH={}}
  document.title=`${D.title} · Wyprawka`;
  $("#title").textContent=D.title;$("#intro").textContent=D.intro;
  render();
  const n=document.querySelector("[data-now]");if(n)n.scrollIntoView({block:"start"});
}
function shops(k){
  const e=SH&&SH[id]&&SH[id][k];if(!e||!window.SHOPS)return"";
  const P=e.products||[];
  return `<nav class="shops" aria-label="${esc(t("l.shops"))}">${SHOPS.list.map(s=>{
    const p=P.find(x=>x.store===s.id), url=SHOPS.link(s.id,p?p.url:s.search(e.q));
    return `<a class="shop" href="${esc(url)}" target="_blank" rel="sponsored nofollow noopener" style="--c:${s.color};--i:${s.ink}">
      <span class="th" aria-hidden="true">${p&&p.img?`<img src="${esc(p.img)}" alt="" loading="lazy">`:esc(s.name[0])}</span>
      <span><b>${esc(s.name)}</b><small>${p?esc(p.title)+(p.price?` · ${esc(p.price)}`:""):t("l.shop")}</small></span></a>`}).join("")}</nav>`;
}
function progress(){
  const c=Store.checks(id);let all=0,done=0;
  D.sections.forEach((s,si)=>s.items.forEach((it,ii)=>{if(it.kind==="rule")return;all++;if(c[key(si,ii)])done++}));
  $("#pbar").style.width=(all?done/all*100:0)+"%";$("#ptxt").textContent=`${done} / ${all}`;
}
function render(){
  $("#filters").innerHTML=[["all",t("l.f.all")],["must",t("l.must")],["todo",t("l.f.todo")]].map(([v,n])=>`<button type="button" class="chip" aria-pressed="${v===filter}" data-f="${v}">${n}</button>`).join("");
  $("#filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
  const c=Store.checks(id), kid=Store.kid(), age=kid?Store.ageMonths(kid):null;
  let html=D.sections.map((s,si)=>{
    const isNow=age!=null&&s.ageFrom!=null&&age>=s.ageFrom&&age<s.ageTo;
    const items=s.items.map((it,ii)=>({it,k:key(si,ii)})).filter(({it,k})=>
      filter==="all"||it.kind==="rule"||(filter==="must"&&it.level==="must")||(filter==="todo"&&!c[k]));
    if(!items.length)return"";
    const buy=s.items.filter(i=>i.kind!=="rule"), bought=s.items.filter((i,ii)=>i.kind!=="rule"&&c[key(si,ii)]).length;
    return `<section class="card"${isNow?" data-now":""}><div class="sec-h"><h2>${esc(s.title)}${isNow?`<span class="now">${t("l.now")}</span>`:""}</h2>${buy.length?`<span class="cnt">${bought}/${buy.length}</span>`:""}</div>
      ${s.tip?`<p class="tip">${esc(s.tip)}</p>`:""}
      <ul class="items">${items.map(({it,k})=>{
        const rule=it.kind==="rule", done=!!c[k];
        return `<li class="it${done?" done":""}">${rule?`<span class="rule" aria-hidden="true">!</span>`:`<input type="checkbox" id="c-${k}" data-k="${k}"${done?" checked":""}>`}
        <div><div class="top-line"><label class="nm"${rule?"":` for="c-${k}"`}>${esc(it.name)}</label>${it.qty?`<span class="qty">${esc(it.qty)}</span>`:""}${!rule&&it.level?`<span class="lvl ${it.level}">${LV[it.level]}</span>`:""}</div>
        ${it.why?`<p class="why">${esc(it.why)}</p>`:""}
        ${it.criteria?`<ul class="crit">${it.criteria.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
        ${it.norm?`<div class="norm">${t("l.norm")}: ${esc(it.norm)}</div>`:""}${!rule&&it.level==="must"?shops(k):""}</div></li>`}).join("")}</ul></section>`;
  }).join("");
  if(D.avoid)html+=`<section class="card avoid"><h2>${esc(D.avoid.title)}</h2><ul class="items">${D.avoid.items.map(a=>`<li class="it"><div><div class="nm">${esc(a.name)}</div><p class="why">${esc(a.why)}</p></div></li>`).join("")}</ul></section>`;
  $("#aff").hidden=!(SH&&SH[id]);$("#aff").textContent=t("l.aff");
  $("#list").innerHTML=html;
  $("#list").querySelectorAll("input[data-k]").forEach(x=>x.onchange=()=>{Store.setCheck(id,x.dataset.k,x.checked);x.closest(".it").classList.toggle("done",x.checked);progress();
    const sec=x.closest("section"),cnt=sec.querySelector(".cnt");if(cnt){const t=sec.querySelectorAll("input[data-k]"),d=[...t].filter(i=>i.checked).length;cnt.textContent=`${d}/${cnt.textContent.split("/")[1]}`}});
  progress();
}
window.addEventListener("hashchange",()=>{filter="all";load();scrollTo(0,0)});
load();
})();
</script>
</body>
</html>
